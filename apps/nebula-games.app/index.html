<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nebula Games</title><link rel="stylesheet" href="games.css"><script type="module" src="games.js"></script><script type="module" src="/nebula/import-theme-client.js"></script></head>
<body class="nebula-owned-app">
  <header><img src="icon.svg" width="36" height="36" alt=""><div><h1>Nebula Games</h1><p>Your library, in orbit.</p></div><span id="count" role="status">Loading library…</span></header>
  <div class="workspace">
    <nav aria-label="Library"><button data-view="all" aria-pressed="true">All games</button><button data-view="favorites" aria-pressed="false">Favorites</button><button data-view="recent" aria-pressed="false">Recently played</button><div class="sidebar-note">46 games carried over from NebulaHub.<br><br>Game downloads require an internet connection.</div><a href="/nebula/credits.html" target="_blank" rel="noopener">Credits &amp; source</a></nav>
    <main>
      <div class="tools"><label class="search">Search library<input id="search" type="search" placeholder="Find a game…" autocomplete="off"></label><label>Sort<select id="sort"><option value="az">Title: A–Z</option><option value="za">Title: Z–A</option><option value="recent">Last played</option></select></label></div>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="games" class="games" aria-label="Games"></div>
    </main>
  </div>
</body></html>
