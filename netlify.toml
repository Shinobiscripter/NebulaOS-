[build]
  command = "bash scripts/netlify-build.sh"
  publish = "static"

[build.environment]
  NODE_VERSION = "24.21.0"
  PNPM_VERSION = "10.12.1"
  NPM_FLAGS = "--no-audit --no-fund"

# Headers are generated into static/_headers by scripts/package-nebula.mjs.
# No SPA catch-all: /fs and /service are handled by Anura's service worker.
# A missing JS/WASM file must return 404, not the desktop HTML.
